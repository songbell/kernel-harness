[project]
name = "cm-kernel-harness"
version = "0.1.0"
description = "Measurement, verification and calibration harness for Intel CM GPU kernels"
requires-python = ">=3.11"
# ckh.reference imports numpy unconditionally, so it is a runtime dependency, not a dev one.
# torch is deliberately NOT here: only TorchReference needs it, and the measurement box
# usually already has a specific build of it that pip must not fight over.
dependencies = ["numpy"]

[project.scripts]
ckh = "ckh.cli:main"
ckh-mcp = "ckh.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ckh", "ckh.mcp"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
